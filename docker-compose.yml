services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devopsbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devopsbot}
      POSTGRES_DB: ${POSTGRES_DB:-devopsbot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devopsbot} -d ${POSTGRES_DB:-devopsbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
