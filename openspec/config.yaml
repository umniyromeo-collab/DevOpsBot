schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: DevOpsBot — C++ сервис проверки статуса HTTP/HTTPS-ресурсов + Telegram-бот.
  Stack: C++, CMake (FetchContent), cpr, nlohmann_json, libpqxx (PostgreSQL), GoogleTest, docker-compose.
  Layout: internal/status_checker (главный бинарь DevOpsBot), internal/telegram_bot,
  internal/lib (thread pool, thread queue), сборка в cmake-build-debug/.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
